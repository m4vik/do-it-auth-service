name: do-it-auth-tests
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: local-demo-password
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U auth -d auth']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5-alpine
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
